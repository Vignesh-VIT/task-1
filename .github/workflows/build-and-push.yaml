# .github/workflows/full-pipeline.yml
name: Full Pipeline Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**

jobs:
  dev-verify:
    name: Dev - Verify
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
        with:
          environment: dev

  dev-plan:
    runs-on: ubuntu-latest
    needs: dev-verify
    environment: dev
    steps:
      - uses: ./.github/actions/plan
        with:
          environment: dev

  dev-apply:
    runs-on: ubuntu-latest
    needs: dev-plan
    environment: dev
    steps:
      - uses: ./.github/actions/apply
        with:
          environment: dev

  qa-verify:
    runs-on: ubuntu-latest
    needs: dev-apply
    environment: qa
    steps:
      - uses: ./.github/actions/verify
        with:
          environment: qa

  qa-plan:
    runs-on: ubuntu-latest
    needs: qa-verify
    environment: qa
    steps:
      - uses: ./.github/actions/plan
        with:
          environment: qa

  qa-apply:
    runs-on: ubuntu-latest
    needs: qa-plan
    environment: qa
    steps:
      - uses: ./.github/actions/apply
        with:
          environment: qa

  prod-verify:
    runs-on: ubuntu-latest
    needs: qa-apply
    environment: prod
    steps:
      - uses: ./.github/actions/verify
        with:
          environment: prod

  prod-plan:
    runs-on: ubuntu-latest
    needs: prod-verify
    environment: prod
    steps:
      - uses: ./.github/actions/plan
        with:
          environment: prod

  prod-apply:
    runs-on: ubuntu-latest
    needs: prod-plan
    environment: prod
    steps:
      - uses: ./.github/actions/apply
        with:
          environment: prod
